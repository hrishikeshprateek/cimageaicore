[project]
name = "cimage-ai"
version = "0.1.0"
description = "CIMAGE AI Media Platform - Video -> Knowledge Blocks engine (V0.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=2.3.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
