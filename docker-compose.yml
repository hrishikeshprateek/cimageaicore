# The whole platform on one box: API (+ folder watcher, workers, admin panel), PostgreSQL/pgvector, Redis, Ollama (local embeddings).
# First start:  cp .env.example .env  (fill GEMINI_API_KEY, NAS_WATCH_DIR, PUBLISH_SECRET_KEY)  ->  docker compose up -d
# The embedding model is pulled automatically (ollama-pull); open http://<host>:8000/admin once `docker compose ps` shows api healthy.
services:
  api:
    image: ${API_IMAGE:-hrishikeshprateek/cimage-ai-api:latest}   # install/update scripts BUILD this from the checked-out source (always the code in git); PULL_IMAGE=1 pulls it from Docker Hub instead
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}            # scripts export these before `docker compose build`
        BUILD_DATE: ${BUILD_DATE:-}
    env_file: .env
    restart: unless-stopped   # come back after a reboot / Docker restart; only `docker compose stop` keeps it down
    environment:
      DATA_DIR: /data
      NAS_ALLOWED_ROOTS: /nas
      DATABASE_URL: postgresql://cimage:cimage@postgres:5432/cimage_ai
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: ollama     # EmbeddingGemma on this box; set gemini to pay for the API instead
      OLLAMA_URL: http://ollama:11434
      WATCHER_ENABLED: "true"        # scan the folder below; new videos -> analysis -> blocks -> embeddings -> draft
      WATCH_ROOTS: /nas                # = the host folder in NAS_WATCH_DIR, mounted below; point NAS_WATCH_DIR at the exact folder to scan
      AUTO_DRAFT: "true"             # the best opportunity of every finished video becomes a blog draft for review
      COMPOSER_TEMPLATES_DIR: /data/composer/templates   # keep templates (the real frame PNGs) and renders on the data volume
      COMPOSER_RENDERS_DIR: /data/renders
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ${NAS_WATCH_DIR:-./data/nas-test/AI-Test}:/nas:ro   # the NAS drop folder (read-only), e.g. NAS_WATCH_DIR="/mnt/nas/Cimage AI Agent" in .env on the server
    depends_on:
      postgres: { condition: service_healthy }   # never start against a half-initialised database (the API would fall back to JSON files)
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://localhost:8000/health', timeout=5).read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped   # come back after a reboot / Docker restart; only `docker compose stop` keeps it down
    environment:
      POSTGRES_USER: cimage
      POSTGRES_PASSWORD: cimage
      POSTGRES_DB: cimage_ai
    ports: ["127.0.0.1:5433:5432"]   # localhost only: never expose the database on the LAN; 5433 because a local Postgres may own 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro   # first init applies every migration; the API re-checks on each start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimage -d cimage_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]   # localhost only
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]   # localhost only: the `ollama` CLI on the host can still talk to it
    volumes: [ollama:/root/.ollama]   # pulled models live here (embeddinggemma ≈ 620 MB)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-pull:   # one-shot: pulls the embedding model into the ollama volume, then exits (re-runs harmlessly on every `up`)
    image: ollama/ollama
    restart: "no"
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_EMBED_MODEL:-embeddinggemma}"]
    depends_on:
      ollama: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  ollama:
