# Build and publish the API image on every push to main (and on version tags) - multi-arch, from GitHub's runners,
# so a server can `PULL_IMAGE=1` without anyone's laptop being involved.
# One-time setup in the GitHub repo: Settings -> Secrets and variables -> Actions ->
#   DOCKERHUB_USERNAME = hrishikeshprateek      DOCKERHUB_TOKEN = a Docker Hub access token (Read & Write)
name: docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKERHUB_DISABLED != '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: version from pyproject
        id: v
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cimage-ai-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cimage-ai-api:${{ steps.v.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cimage-ai-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
