<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIMAGE Video Composer</title>
<style>
  :root{--bg:#f4f5f8;--card:#fff;--ink:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--accent-soft:#dbeafe;--ok:#15803d;--ok-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--gold:#d9a919;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--shadow:0 1px 2px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--muted:#9aa3b2;--line:#2a2f3a;--accent:#60a5fa;--accent-soft:#1e2a44;--ok:#4ade80;--ok-soft:#14301f;--bad:#f87171;--bad-soft:#3b1a1a;--warn:#fbbf24;--warn-soft:#3a2a0e;--gold:#f5c542;--shadow:none}}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card)}
  header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}header h1 span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
  header a{color:var(--accent);text-decoration:none;font-size:13px;margin-right:14px}
  .badge{font:12px var(--mono);padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}.badge.off{background:var(--bad-soft);color:var(--bad)}
  main{display:grid;grid-template-columns:320px minmax(560px,1fr) 400px;gap:20px;padding:20px 24px 60px;max-width:1800px;margin:0 auto;align-items:start}
  @media(max-width:1280px){main{grid-template-columns:300px 1fr}#right{grid-column:1/-1}}
  @media(max-width:860px){main{grid-template-columns:1fr;padding:14px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2,.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
  .sub{margin-top:18px}
  .job{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.12s}
  .job:hover,.job.sel{border-color:var(--accent);background:var(--accent-soft)}.job.dis{opacity:.45;cursor:default}
  .job .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px;font-size:13px}.job .t{font-size:11px;color:var(--muted)}
  .chip{font:11px var(--mono);padding:2px 8px;border-radius:6px;background:var(--line);white-space:nowrap}
  .chip.DONE{background:var(--ok-soft);color:var(--ok)}.chip.FAILED{background:var(--bad-soft);color:var(--bad)}.chip.RENDERING,.chip.QUEUED{background:var(--accent-soft);color:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13px}
  input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  label.f{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  button{padding:9px 14px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s}
  button:hover{filter:brightness(1.08)}button.sec{background:var(--line);color:var(--ink)}button.sm{padding:6px 10px;font-size:12.5px;font-weight:500}button.ghost{background:none;color:var(--accent);padding:6px 8px}
  button:disabled{opacity:.5;cursor:default;filter:none}button.big{width:100%;padding:13px;font-size:15px;border-radius:11px}
  kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fix{flex:0 0 auto}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
  /* framing: how the clip lands in the template's window */
  .framing{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:6px}@media(max-width:700px){.framing{grid-template-columns:1fr}}
  .frprev{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:60px}.frprev img{width:100%;display:block;max-height:260px;object-fit:contain}
  .frprev .crop{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 2000px rgba(0,0,0,.6);pointer-events:none;border-radius:3px}
  .frprev .crop::after{content:attr(data-l);position:absolute;left:6px;top:4px;font:10.5px var(--mono);color:var(--gold);text-shadow:0 1px 2px #000}
  .framing input[type=range]{flex:1;accent-color:var(--accent)}
  .fitopts{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}.fitopts label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:5px 9px;border:1px solid var(--line);border-radius:9px}.fitopts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .cut{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.12s}.cut:hover{border-color:var(--accent)}.cut.sel{border-color:var(--accent);background:var(--accent-soft)}
  .cut h4{margin:0 0 5px;font-size:13.5px;font-weight:600;line-height:1.35}.cut .m{font-size:12px;color:var(--muted);line-height:1.4}.cut .ts{font:11.5px var(--mono);color:var(--accent);margin-right:6px}.cut .sc{float:right;font:11px var(--mono);color:var(--muted)}
  /* player + trim bar */
  .player{position:relative;background:#000;border-radius:12px;overflow:hidden}.player video{width:100%;display:block;max-height:52vh;background:#000}
  .trim{position:relative;height:44px;margin:14px 0 6px;border-radius:9px;background:var(--line);cursor:pointer;user-select:none;touch-action:none}
  .trim .win{position:absolute;top:0;bottom:0;background:var(--accent-soft);border:2px solid var(--accent);border-radius:8px;opacity:.9}
  .trim .h{position:absolute;top:-6px;bottom:-6px;width:14px;margin-left:-7px;background:var(--accent);border-radius:6px;cursor:ew-resize;box-shadow:0 0 0 2px var(--card)}
  .trim .h::after{content:"";position:absolute;left:5px;right:5px;top:14px;bottom:14px;border-left:1px solid #fff5;border-right:1px solid #fff5}
  .trim .ph{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);pointer-events:none}
  .trim .tick{position:absolute;bottom:-18px;font:10.5px var(--mono);color:var(--muted);transform:translateX(-50%)}
  .tc{font:13px var(--mono);color:var(--ink)}.tc b{color:var(--accent);font-weight:600}
  .nudge{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
  /* cues */
  .cue{display:grid;grid-template-columns:70px 70px minmax(0,1fr) 28px;gap:6px;align-items:center;margin-bottom:5px}.cue input{padding:7px 8px;font-size:13px}.cue input[type=number]{font-family:var(--mono);font-size:12px}
  .cue .x{background:none;color:var(--muted);padding:0;font-size:18px;line-height:1}.cue .x:hover{color:var(--bad)}
  .cue.dim input{opacity:.55}
  .msg{font-size:12.5px;margin-top:8px;color:var(--muted);min-height:18px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
  .warn{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:12.5px;margin:10px 0}
  .err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:12px;font-family:var(--mono);word-break:break-word}
  /* renders */
  .render{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12.5px}.render .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.render .head b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .render .k{font:11px var(--mono);color:var(--muted);word-break:break-word;line-height:1.5}
  .render .prev{position:relative;margin-top:10px;border-radius:10px;overflow:hidden;background:#000;display:flex;justify-content:center}
  .render .prev img,.render .prev video{display:block;max-width:100%;max-height:440px;cursor:pointer}
  .render .prev.wide video,.render .prev.wide img{width:100%}
  .render .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .render .play span{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  .render .links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px}.render .links a{color:var(--accent);text-decoration:none;font-weight:600}
  .presets{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px}.presets label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:9px}.presets label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .tpl img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#000}
  details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
  .kv{font-size:12px;color:var(--muted)}.kv b{color:var(--ink);font-family:var(--mono);font-weight:500}
  .sticky{position:sticky;bottom:0;background:var(--card);padding-top:12px;margin-top:14px;border-top:1px solid var(--line)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>CIMAGE Video Composer <span>analysed review → branded short</span></h1>
  <span><a href="/admin" style="font-weight:600">Admin</a><a href="/">← Video Intelligence</a><a href="/content">Content Center</a><span id="sys" class="badge">…</span></span>
</header>
<main>
  <section id="left">
    <div class="card"><h2>Analysed videos <span class="chip" id="jobcount"></span></h2><div id="jobs"><div class="empty">Loading…</div></div></div>
    <div class="card tpl"><h2>Template &amp; output</h2>
      <select id="tpl"></select>
      <div class="presets" style="margin-top:12px">
        <label><input type="checkbox" value="reels" checked> Reels 9:16</label>
        <label><input type="checkbox" value="square"> Feed 1:1</label>
        <label><input type="checkbox" value="landscape"> YouTube 16:9</label>
      </div>
      <img id="tplprev" alt="template preview" hidden>
      <details style="margin-top:12px"><summary>Upload a real layer (PNG with alpha / .mov 4444 / .webm)</summary>
        <label class="f">Template name</label><input type="text" id="upname" placeholder="cimage">
        <div class="row"><div><label class="f">Preset</label><select id="uppreset"><option value="reels">reels</option><option value="square">square</option><option value="landscape">landscape</option></select></div>
          <div><label class="f">Layer name</label><input type="text" id="uplayer" value="frame"></div></div>
        <div class="row"><div><label class="f">x</label><input type="number" id="upx" value="0"></div><div><label class="f">y</label><input type="number" id="upy" value="0"></div><div><label class="f">z</label><input type="number" id="upz" value="0"></div></div>
        <label class="f" style="text-transform:none;letter-spacing:0;font-weight:500"><input type="checkbox" id="upreplace" checked> replace all existing layers of this preset (full-frame PNG)</label>
        <input type="file" id="upfile" accept=".png,.mov,.webm" style="margin:8px 0">
        <button class="sm" id="upgo">Upload</button><div class="msg" id="upmsg"></div>
      </details>
    </div>
  </section>

  <section id="center"><div class="card" id="editor"><div class="empty">Pick an analysed video with a local file.</div></div></section>

  <section id="right"><div class="card"><h2>Renders <span class="chip" id="rcount"></span></h2><div id="renders"><div class="empty">No renders yet.</div></div></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,opt){const r=await fetch('/api/v1'+p,opt);if(r.ok)return r.status===204?null:r.json();let d;try{d=await r.json()}catch(e){d={detail:r.statusText}}throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail))}
const post=(p,body)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const ts=s=>{s=Math.max(0,+s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=(s%60).toFixed(1).padStart(4,'0');return (h?h+':':'')+String(m).padStart(2,'0')+':'+x};
const r1=x=>Math.round(x*10)/10;
let SYSTEM=null,JOBS=[],JOBSIG='',SEL=null,JOB=null,CUTS=null,CUT=null,DUR=0,TPL='placeholder',RENDERS=[];
const ED_FRAMING=()=>({fit:'auto',focus_x:0.5,focus_y:0.5});
let ED={cut_in:0,cut_out:0,captions:[],captions_enabled:true,lower_third:{name:'',role:''},title:'',cut_id:null,...ED_FRAMING()};
let FR=null,FOCUS_MANUAL=false,FR_REQ=0,FR_TIMER=null,FR_IMG_KEY='';   // last /framing answer; true once the user moved the focus slider
let toastTimer=null;function toast(t,err){const el=$('#toast');el.textContent=t;el.style.background=err?'var(--bad)':'var(--ink)';el.style.color=err?'#fff':'var(--bg)';el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2600)}

async function init(){
  try{SYSTEM=await api('/composer/system')}catch(e){$('#sys').textContent='API error';return}
  const b=$('#sys');
  if(!SYSTEM.enabled){b.textContent='COMPOSER_ENABLED=false';b.className='badge off';$('#editor').innerHTML='<div class="warn">The composer is switched off. Set <code>COMPOSER_ENABLED=true</code> in <code>.env</code> and restart the API.</div>';return}
  b.textContent=(SYSTEM.ffmpeg.version||'ffmpeg ?').replace(/ Copyright.*/,'')+' · '+(SYSTEM.text_shaping.raqm_in_process||SYSTEM.text_shaping.subprocess_fallback?'Devanagari ok':'no text shaping');
  TPL=SYSTEM.template;renderTemplates();await refreshJobs();setInterval(refreshJobs,6000);setInterval(refreshRenders,2500);
  const m=location.hash.match(/job=([a-f0-9]+)/);if(m&&JOBS.find(j=>j.id===m[1]))select(m[1]);
}
function renderTemplates(){const sel=$('#tpl');sel.innerHTML=(SYSTEM.templates||[]).map(t=>`<option value="${esc(t.name)}" ${t.name===TPL?'selected':''}>${esc(t.name)}${t.error?' (broken)':''}${t.missing_files&&t.missing_files.length?' (missing files)':''}</option>`).join('');sel.onchange=()=>{TPL=sel.value;previewTemplate();syncRenderButton();if(SEL)scheduleFraming(false,0)};previewTemplate();}
function previewTemplate(){const p=document.querySelector('.presets input:checked')?.value||'reels';const img=$('#tplprev');img.hidden=false;img.src='/api/v1/composer/templates/'+encodeURIComponent(TPL)+'/preview?preset='+p+'&t='+Date.now();}
document.querySelectorAll('.presets input').forEach(c=>c.onchange=()=>{previewTemplate();syncRenderButton();if(SEL)scheduleFraming(false,0)});
const selectedPresets=()=>[...document.querySelectorAll('.presets input:checked')].map(c=>c.value);

// ---------------------------------------------------------------- jobs
async function refreshJobs(){let jobs;try{jobs=await api('/jobs')}catch(e){return}JOBS=jobs.filter(j=>j.source.kind!=='online');const sig=JOBS.map(j=>j.id+j.state).join()+SEL;if(sig===JOBSIG)return;JOBSIG=sig;$('#jobcount').textContent=JOBS.length;renderJobs();}
function renderJobs(){const el=$('#jobs');if(!JOBS.length){el.innerHTML='<div class="empty">No analysed local videos yet. Analyse one on the <a href="/">main page</a>.</div>';return}
 el.innerHTML=JOBS.map(j=>{const ok=j.state==='BLOCKS_COMPLETE'||(j.block_counts&&Object.keys(j.block_counts).length);return `<div class="job ${j.id===SEL?'sel':''} ${ok?'':'dis'}" data-id="${j.id}" title="${esc(j.source.path||'')}"><div><div class="n">${esc(j.source.name)}</div><div class="t">${j.source.duration_seconds?ts(j.source.duration_seconds):'–'} · ${(j.block_counts||{}).quotes??0} quotes · ${(j.block_counts||{}).transcript??0} segments</div></div><span class="chip">${ok?'ready':j.state}</span></div>`}).join('');
 el.querySelectorAll('.job:not(.dis)').forEach(n=>n.onclick=()=>select(n.dataset.id));}

async function select(id){if(id===SEL)return;SEL=id;JOB=JOBS.find(x=>x.id===id);CUTS=null;CUT=null;JOBSIG='';history.replaceState(null,'','#job='+id);renderJobs();mountEditor();
 try{CUTS=await api('/jobs/'+id+'/cuts');DUR=CUTS.duration_seconds||JOB.source.duration_seconds||0}catch(e){$('#cuts').innerHTML='<div class="err">'+esc(e.message)+'</div>';return}
 if(CUTS.cuts.length)loadCut(CUTS.cuts[0]);else ED={cut_in:0,cut_out:Math.min(30,DUR||30),captions:[],captions_enabled:true,lower_third:{name:'',role:''},title:'',cut_id:null,...ED_FRAMING()};
 renderCuts();syncTrim();syncFields();renderCues();scheduleFraming(true,0);await refreshRenders(true);}
function loadCut(c){CUT=c.id;ED={cut_in:c.in_seconds,cut_out:c.out_seconds,captions:c.captions.map(x=>({...x})),captions_enabled:true,lower_third:{name:c.lower_third?.name||'',role:c.lower_third?.role||''},title:c.title,cut_id:c.id,...ED_FRAMING()};FOCUS_MANUAL=false;}

// ---------------------------------------------------------------- editor (built once per job; parts update in place)
function mountEditor(){const j=JOB;
 $('#editor').innerHTML=`<h2>${esc(j.source.name)} <span class="chip">${ts(j.source.duration_seconds||0)}</span></h2>
 <div class="player"><video id="src" src="/api/v1/jobs/${j.id}/media" controls preload="metadata" playsinline></video></div>
 <div class="trim" id="trim"><div class="win" id="win"></div><div class="h" id="hin" title="drag: IN"></div><div class="h" id="hout" title="drag: OUT"></div><div class="ph" id="ph"></div><span class="tick" style="left:0">0:00</span><span class="tick" id="tickend" style="left:100%"></span></div>
 <div class="row" style="margin-top:22px"><span class="tc fix">IN <b id="tin">0:00.0</b> &nbsp;→&nbsp; OUT <b id="tout">0:00.0</b> &nbsp;=&nbsp; <b id="tlen">0.0</b>s</span><span class="fix kv">playhead <b id="phv">0.0</b>s</span><span></span>
   <button class="sm sec fix" id="setin" title="key: I">⟵ IN here</button><button class="sm sec fix" id="setout" title="key: O">OUT here ⟶</button><button class="sm sec fix" id="loop" title="key: L">▶ loop the cut</button></div>
 <div class="kv" style="margin-top:6px">Drag the blue handles or press <kbd>I</kbd> / <kbd>O</kbd> at the playhead · <kbd>space</kbd> play/pause · <kbd>L</kbd> loop · <kbd>←</kbd>/<kbd>→</kbd> step 0.2s</div>
 <div id="cutwarn"></div>
 <div class="grid2" style="margin-top:8px">
  <div><div class="sub">Proposed cuts <span id="refinebox"></span></div><div id="cuts"><div class="empty">Proposing cuts…</div></div></div>
  <div>
   <div class="sub">Fine trim (seconds)</div>
   <div class="row"><input type="number" id="cin" step="0.1" min="0"><span class="fix">→</span><input type="number" id="cout" step="0.1" min="0"></div>
   <div class="nudge"><span>IN</span><button class="sm sec" data-n="in" data-d="-1">−1s</button><button class="sm sec" data-n="in" data-d="-0.2">−0.2</button><button class="sm sec" data-n="in" data-d="0.2">+0.2</button><button class="sm sec" data-n="in" data-d="1">+1s</button>
     <span>OUT</span><button class="sm sec" data-n="out" data-d="-1">−1s</button><button class="sm sec" data-n="out" data-d="-0.2">−0.2</button><button class="sm sec" data-n="out" data-d="0.2">+0.2</button><button class="sm sec" data-n="out" data-d="1">+1s</button></div>
   <label class="f">Lower third (name · role)</label>
   <div class="row"><input type="text" id="ltname" placeholder="Name"><input type="text" id="ltrole" placeholder="Role / batch / company"></div>
   <label class="f">Title (label for the render)</label><input type="text" id="title">
  </div>
 </div>
 <div class="sub" style="display:flex"><span>Framing <span id="frfit" class="chip"></span></span><span class="kv" id="frinfo"></span></div>
 <div class="framing">
  <div class="frprev" id="frprev"><img id="frimg" alt="frame at IN"><div class="crop" id="frcrop" hidden></div></div>
  <div>
   <div class="fitopts"><label title="fill the clip window for wide sources; letterbox only when cropping would lose too much"><input type="radio" name="fit" value="auto" checked> Auto</label><label title="scale to fill the window and crop the overflow"><input type="radio" name="fit" value="cover"> Fill (crop)</label><label title="show the whole frame, brand colour around it"><input type="radio" name="fit" value="contain"> Fit (letterbox)</label></div>
   <div class="row" style="margin-top:10px"><span class="fix kv" id="frax">focus</span><input type="range" id="focus" min="0" max="100" value="50"><button class="sm sec fix" id="refocus" title="re-run face detection on this cut">↻ faces</button></div>
   <div class="kv" id="frnote" style="margin-top:6px"></div>
  </div>
 </div>
 <div class="sub" style="display:flex"><span><input type="checkbox" id="capon" checked> Burn captions <span id="cuecount" class="chip"></span></span><span><button class="sm sec" id="regen" title="regenerate the cues for the current IN/OUT from the transcript">↻ from transcript</button> <button class="sm sec" id="addcue">+ cue</button></span></div>
 <div class="kv" style="margin-bottom:6px">Times are seconds from the cut's IN point. Edit the text freely (Hindi/English both fine); cues outside the cut are greyed.</div>
 <div id="cues"></div>
 <div class="sticky"><button class="big" id="render">Render</button><div class="msg" id="rmsg"></div></div>`;
 bindEditor();}

function bindEditor(){const v=$('#src');
 v.addEventListener('timeupdate',()=>{$('#phv').textContent=v.currentTime.toFixed(1);const d=DUR||v.duration||0;$('#ph').style.left=(d?100*v.currentTime/d:0)+'%';if(LOOP&&v.currentTime>=ED.cut_out){v.currentTime=ED.cut_in}});
 v.addEventListener('loadedmetadata',()=>{if(!DUR)DUR=v.duration;syncTrim()});
 $('#setin').onclick=()=>setIn(v.currentTime);$('#setout').onclick=()=>setOut(v.currentTime);$('#loop').onclick=toggleLoop;
 $('#cin').onchange=()=>setIn(+$('#cin').value);$('#cout').onchange=()=>setOut(+$('#cout').value);
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(b.dataset.n==='in'){setIn(ED.cut_in+d);v.currentTime=ED.cut_in}else{setOut(ED.cut_out+d);v.currentTime=Math.max(0,ED.cut_out-1.5)}});
 $('#ltname').oninput=e=>ED.lower_third.name=e.target.value;$('#ltrole').oninput=e=>ED.lower_third.role=e.target.value;$('#title').oninput=e=>ED.title=e.target.value;
 $('#capon').onchange=e=>{ED.captions_enabled=e.target.checked;syncRenderButton()};
 document.querySelectorAll('input[name=fit]').forEach(r=>r.onchange=()=>{ED.fit=r.value;scheduleFraming(!FOCUS_MANUAL,0)});
 $('#focus').oninput=e=>{FOCUS_MANUAL=true;const v=+e.target.value/100;if(cropAxis()==='y')ED.focus_y=v;else ED.focus_x=v;drawCrop()};
 $('#refocus').onclick=()=>{FOCUS_MANUAL=false;scheduleFraming(true,0)};
 $('#addcue').onclick=()=>{ED.captions.push({start:r1(Math.max(0,(ED.captions.at(-1)?.end)||0)),end:r1(Math.max(0,(ED.captions.at(-1)?.end)||0)+2),text:''});renderCues();$('#cues .cue:last-child input[type=text]').focus()};
 $('#regen').onclick=async()=>{try{ED.captions=await api(`/jobs/${SEL}/captions?cut_in=${ED.cut_in}&cut_out=${ED.cut_out}`);renderCues();toast('Captions regenerated for '+ts(ED.cut_in)+' → '+ts(ED.cut_out))}catch(e){toast(e.message,1)}};
 $('#render').onclick=doRender;
 // trim bar dragging
 const bar=$('#trim');let drag=null;
 const pos=e=>{const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(DUR||v.duration||0)};
 bar.addEventListener('pointerdown',e=>{if(e.target.id==='hin'||e.target.id==='hout'){drag=e.target.id;bar.setPointerCapture(e.pointerId)}else{v.currentTime=pos(e)}});
 bar.addEventListener('pointermove',e=>{if(!drag)return;const t=pos(e);if(drag==='hin')setIn(Math.min(t,ED.cut_out-0.5));else setOut(Math.max(t,ED.cut_in+0.5));v.currentTime=drag==='hin'?ED.cut_in:Math.max(0,ED.cut_out-0.1)});
 bar.addEventListener('pointerup',()=>{drag=null});bar.addEventListener('pointercancel',()=>{drag=null});
}
let LOOP=false;
function toggleLoop(){const v=$('#src');LOOP=!LOOP;if(LOOP){v.currentTime=ED.cut_in;v.play();$('#loop').textContent='■ stop loop'}else{v.pause();$('#loop').textContent='▶ loop the cut'}}
function setIn(t){ED.cut_in=r1(Math.max(0,Math.min(t,DUR?DUR-0.5:t)));if(ED.cut_out<=ED.cut_in)ED.cut_out=r1(ED.cut_in+1);syncTrim();syncFields();scheduleFraming(!FOCUS_MANUAL)}
function setOut(t){ED.cut_out=r1(Math.max(0.5,DUR?Math.min(t,DUR):t));if(ED.cut_in>=ED.cut_out)ED.cut_in=r1(Math.max(0,ED.cut_out-1));syncTrim();syncFields();scheduleFraming(!FOCUS_MANUAL)}
function syncTrim(){const d=DUR||1;$('#win').style.left=(100*ED.cut_in/d)+'%';$('#win').style.width=(100*(ED.cut_out-ED.cut_in)/d)+'%';$('#hin').style.left=(100*ED.cut_in/d)+'%';$('#hout').style.left=(100*ED.cut_out/d)+'%';$('#tickend').textContent=ts(DUR);
 $('#tin').textContent=ts(ED.cut_in);$('#tout').textContent=ts(ED.cut_out);$('#tlen').textContent=(ED.cut_out-ED.cut_in).toFixed(1);
 const len=ED.cut_out-ED.cut_in,lim=SYSTEM.cuts||{};$('#cutwarn').innerHTML=len>lim.max?`<div class="warn">This cut is ${len.toFixed(0)}s — longer than the ${lim.max}s target for shorts. It will still render.</div>`:'';
 document.querySelectorAll('#cues .cue').forEach(r=>r.classList.toggle('dim',+r.querySelector('[data-k=start]').value>=len));syncRenderButton()}
function syncFields(){$('#cin').value=ED.cut_in;$('#cout').value=ED.cut_out;$('#ltname').value=ED.lower_third.name||'';$('#ltrole').value=ED.lower_third.role||'';$('#title').value=ED.title||'';$('#capon').checked=ED.captions_enabled}
// ---------------------------------------------------------------- framing (fit + crop focus)
const framingPreset=()=>{const p=selectedPresets();return p.includes('reels')?'reels':(p[0]||'reels')};
function scheduleFraming(detect,delay=450){clearTimeout(FR_TIMER);FR_TIMER=setTimeout(()=>loadFraming(detect),delay)}
async function loadFraming(detect){if(!SEL||!$('#frprev'))return;const req=++FR_REQ;
 $('#frnote').textContent=detect?'looking for faces in this cut…':'';
 const q=`/jobs/${SEL}/framing?cut_in=${ED.cut_in}&cut_out=${ED.cut_out}&preset=${framingPreset()}&template=${encodeURIComponent(TPL)}&fit=${ED.fit}&detect=${detect?'true':'false'}`;
 let fr;try{fr=await api(q)}catch(e){if(req===FR_REQ)$('#frnote').textContent=e.message;return}
 if(req!==FR_REQ)return;FR=fr;
 if(detect&&!FOCUS_MANUAL){ED.focus_x=fr.focus_x;ED.focus_y=fr.focus_y}
 renderFraming();}
function cropAxis(){if(!FR||!FR.crop)return null;const c=FR.crop;return c.scaled_w>c.w?'x':c.scaled_h>c.h?'y':null}
function renderFraming(){if(!FR)return;const img=$('#frimg');const at=Math.max(0,ED.cut_in+Math.min(0.5,(ED.cut_out-ED.cut_in)/2));const key=SEL+'@'+at.toFixed(1);
 if(key!==FR_IMG_KEY){FR_IMG_KEY=key;img.src=`/api/v1/jobs/${SEL}/frame?at=${at.toFixed(2)}&width=640`}
 const ax=cropAxis(),sub=FR.subject||{};$('#frfit').textContent=FR.fit==='cover'?'fill · crop':'fit · letterbox';
 $('#frinfo').textContent=`${FR.source_width}×${FR.source_height} → ${FR.video_rect.w}×${FR.video_rect.h} window of the ${FR.preset} canvas`;
 const sl=$('#focus');sl.disabled=!ax;$('#refocus').disabled=FR.fit!=='cover'||!FR.detector;
 $('#frax').textContent=ax==='y'?'focus ↕':'focus ↔';
 if(ax)sl.value=Math.round((ax==='y'?ED.focus_y:ED.focus_x)*100);
 let note='';
 if(FR.fit!=='cover')note='Whole frame shown; the brand colour fills the rest of the window.';
 else if(!ax)note='Source matches the window exactly — nothing to crop.';
 else{const keep=ax==='x'?FR.crop.w/FR.crop.scaled_w:FR.crop.h/FR.crop.scaled_h;note=`Keeps ${Math.round(keep*100)}% of the ${ax==='x'?'width':'height'}. `;
  if(!FR.detector)note+='No face detector on this machine — drag the slider to choose what stays in frame.';
  else if(sub.method==='faces')note+=`Faces found in ${sub.frames_with_faces}/${sub.frames_sampled} sampled frames${FOCUS_MANUAL?' (slider moved by you)':' — window centred on them'}.`;
  else if(sub.frames_sampled)note+=`No faces found in ${sub.frames_sampled} sampled frames — centred; drag the slider if the subject is off to one side.`;
  else note+='Drag the slider or press ↻ faces.';}
 $('#frnote').textContent=note;drawCrop();}
function drawCrop(){const box=$('#frcrop');if(!FR||FR.fit!=='cover'||!cropAxis()){box.hidden=true;return}
 const c=FR.crop,x=(c.scaled_w-c.w)*ED.focus_x,y=(c.scaled_h-c.h)*ED.focus_y;
 box.hidden=false;box.style.left=(100*x/c.scaled_w)+'%';box.style.top=(100*y/c.scaled_h)+'%';box.style.width=(100*c.w/c.scaled_w)+'%';box.style.height=(100*c.h/c.scaled_h)+'%';
 box.dataset.l=`${FR.preset} ${c.w}×${c.h}`;}

function syncRenderButton(){const b=$('#render');if(!b)return;const n=selectedPresets().length;b.textContent=`Render ${n} preset${n===1?'':'s'} · ${(ED.cut_out-ED.cut_in).toFixed(1)}s · template “${TPL}”${ED.captions_enabled?'':' · no captions'}`;b.disabled=!n}

function renderCuts(){const el=$('#cuts');const rb=$('#refinebox');
 rb.innerHTML=CUTS?.refined?'<span class="chip">AI refined</span>':'<button class="sm ghost" id="refine">✨ refine with AI</button>';
 const rf=$('#refine');if(rf)rf.onclick=async()=>{rf.disabled=true;rf.textContent='asking Gemini…';try{CUTS=await api('/jobs/'+SEL+'/cuts?refine=true');if(CUTS.cuts.length){loadCut(CUTS.cuts[0]);syncTrim();syncFields();renderCues();$('#src').currentTime=ED.cut_in}renderCuts();toast(CUTS.refined?'Cuts refined by Gemini':CUTS.warning||'no change',!CUTS.refined)}catch(e){toast(e.message,1);rf.disabled=false}};
 el.innerHTML=(CUTS?.warning?`<div class="warn">${esc(CUTS.warning)}</div>`:'')+((CUTS?.cuts||[]).map(c=>`<div class="cut ${c.id===CUT?'sel':''}" data-id="${c.id}"><span class="sc">${c.source} · ${c.score.toFixed(2)}</span><h4>${esc(c.title)}</h4><div class="m"><span class="ts">${c.in_ts} → ${c.out_ts}</span>${c.duration.toFixed(0)}s${c.lower_third?` · 🎙 ${esc(c.lower_third.name)}${c.lower_third.role?', '+esc(c.lower_third.role):''}`:''}</div><div class="m">${esc(c.reason)}</div></div>`).join('')||'<div class="empty">No proposals for this video — set IN/OUT by hand.</div>');
 el.querySelectorAll('.cut').forEach(n=>n.onclick=()=>{loadCut(CUTS.cuts.find(c=>c.id===n.dataset.id));el.querySelectorAll('.cut').forEach(x=>x.classList.toggle('sel',x===n));syncTrim();syncFields();renderCues();const v=$('#src');v.currentTime=ED.cut_in;toast('Loaded cut '+n.dataset.id)});}

function renderCues(){const el=$('#cues');$('#cuecount').textContent=ED.captions.length+' cues';
 el.innerHTML=ED.captions.map((c,i)=>`<div class="cue" data-i="${i}"><input type="number" step="0.1" min="0" value="${c.start}" data-k="start"><input type="number" step="0.1" min="0" value="${c.end}" data-k="end"><input type="text" value="${esc(c.text)}" data-k="text" placeholder="caption text"><button class="x" title="remove cue">×</button></div>`).join('')||'<div class="empty" style="padding:10px">No cues in this window — press ↻ from transcript, or + cue.</div>';
 el.querySelectorAll('.cue').forEach(r=>{const i=+r.dataset.i;r.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ED.captions[i][inp.dataset.k]=inp.type==='number'?+inp.value:inp.value;if(inp.dataset.k==='start')r.classList.toggle('dim',+inp.value>=ED.cut_out-ED.cut_in)});r.querySelector('.x').onclick=()=>{ED.captions.splice(i,1);renderCues()}});
 syncTrim();}

async function doRender(){const presets=selectedPresets();if(!presets.length)return msg('Tick at least one preset.',1);if(ED.cut_out<=ED.cut_in)return msg('OUT must be after IN.',1);
 const caps=ED.captions.filter(c=>c.text.trim()&&c.end>c.start).map(c=>({start:c.start,end:c.end,text:c.text.trim()}));
 $('#render').disabled=true;msg('Queueing…');
 try{const body={cut_in:ED.cut_in,cut_out:ED.cut_out,presets,template:TPL,captions:ED.captions_enabled?caps:[],captions_enabled:ED.captions_enabled,lower_third:ED.lower_third.name.trim()?{name:ED.lower_third.name.trim(),role:ED.lower_third.role.trim()||null}:null,title:ED.title.trim()||null,cut_id:ED.cut_id,fit:ED.fit,focus_x:ED.focus_x,focus_y:ED.focus_y};
  const r=await post('/jobs/'+SEL+'/compose',body);msg('Queued '+r.renders.length+' render(s) — they appear on the right as they finish.','ok');toast('Rendering '+presets.join(' + '));await refreshRenders(true);if(window.innerWidth<1280)$('#right').scrollIntoView({behavior:'smooth'})}
 catch(e){msg(e.message,1)}finally{$('#render').disabled=false}}
function msg(t,cls){const m=$('#rmsg');if(!m)return;m.textContent=t;m.className='msg'+(cls===1?' err':cls?' '+cls:'')}

// ---------------------------------------------------------------- renders: diff-based so playing previews are never torn down
function renderCard(r){const d=document.createElement('div');d.className='render';d.dataset.id=r.id;d.innerHTML=`<div class="head"><b title="${esc(r.title||'')}">${esc(r.title||r.cut_id||'cut')}</b><span class="chip st ${r.status}">${r.status}</span></div><div class="k meta"></div><div class="prev" hidden></div><div class="errbox"></div><div class="links"></div>`;updateCard(d,r,true);return d;}
function updateCard(d,r,force){const st=d.querySelector('.st');if(st.textContent!==r.status||force){st.textContent=r.status;st.className='chip st '+r.status;
  d.querySelector('.meta').innerHTML=`${r.preset} · ${ts(r.cut_in)} → ${ts(r.cut_out)} · ${esc(r.template)}${r.width?` · ${r.width}×${r.height} · ${(r.size_bytes/1e6).toFixed(1)} MB · rendered in ${r.render_seconds}s`:''}${r.spec.captions?.length&&r.spec.captions_enabled?` · ${r.spec.captions.length} cues`:''}${r.spec.lower_third?` · 🎙 ${esc(r.spec.lower_third.name)}`:''}${r.detail?.text_shaping===false?' · ⚠ no Devanagari shaping':''}`;
  d.querySelector('.errbox').innerHTML=r.error?`<div class="err" style="margin-top:8px">${esc(r.error)}</div>`:'';
  const prev=d.querySelector('.prev');
  if(r.status==='DONE'&&!prev.dataset.ready){prev.hidden=false;prev.dataset.ready='1';prev.classList.toggle('wide',r.preset!=='reels');
   prev.innerHTML=`<img src="/api/v1/renders/${r.id}/poster.jpg" alt="" onerror="this.style.minHeight='120px'"><div class="play"><span>▶</span></div>`;
   prev.onclick=()=>{const v=document.createElement('video');v.src=`/api/v1/renders/${r.id}/video`;v.controls=true;v.autoplay=true;v.playsInline=true;v.preload='auto';prev.innerHTML='';prev.appendChild(v);prev.onclick=null;v.play().catch(()=>{})};}
  d.querySelector('.links').innerHTML=r.status==='DONE'?`<a href="/api/v1/renders/${r.id}/video?download=true">⬇ MP4</a>${r.captions_path?`<a href="/api/v1/renders/${r.id}/captions.srt">SRT</a>`:''}<span class="k" title="${esc(r.output_path)}">${esc((r.output_path||'').split('/').slice(-2).join('/'))}</span><button class="sm ghost" data-del="${r.id}" style="margin-left:auto">delete</button>`:`<button class="sm ghost" data-del="${r.id}" ${r.status==='RENDERING'?'disabled':''} style="margin-left:auto">delete</button>`;
  const del=d.querySelector('[data-del]');if(del)del.onclick=async()=>{if(!confirm('Delete this render and its files?'))return;try{await api('/renders/'+r.id,{method:'DELETE'});d.remove();toast('Render deleted')}catch(e){toast(e.message,1)}};}}
async function refreshRenders(force){if(!SEL)return;let list;try{list=await api('/renders?job_id='+SEL)}catch(e){return}
 const el=$('#renders');const changed=force||list.length!==RENDERS.length||list.some((r,i)=>RENDERS[i]?.id!==r.id||RENDERS[i]?.status!==r.status);RENDERS=list;$('#rcount').textContent=list.length;
 if(!changed)return;
 if(!list.length){el.innerHTML='<div class="empty">No renders for this video yet. Pick a cut and press Render.</div>';return}
 if(el.querySelector('.empty'))el.innerHTML='';
 const have=new Map([...el.querySelectorAll('.render')].map(d=>[d.dataset.id,d]));
 let prev=null;
 for(const r of list){let d=have.get(r.id);if(d){updateCard(d,r,false);have.delete(r.id)}else{d=renderCard(r)}
  if(prev?prev.nextSibling!==d:el.firstChild!==d)el.insertBefore(d,prev?prev.nextSibling:el.firstChild);prev=d}
 have.forEach(d=>d.remove());}

// ---------------------------------------------------------------- keyboard
document.addEventListener('keydown',e=>{if(!SEL||e.target.matches('input,textarea,select'))return;const v=$('#src');if(!v)return;
 if(e.key==='i'||e.key==='I'){setIn(v.currentTime);toast('IN = '+ts(ED.cut_in))}else if(e.key==='o'||e.key==='O'){setOut(v.currentTime);toast('OUT = '+ts(ED.cut_out))}
 else if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()}else if(e.key==='l'||e.key==='L'){toggleLoop()}
 else if(e.key==='ArrowLeft'){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-0.2)}else if(e.key==='ArrowRight'){e.preventDefault();v.currentTime=v.currentTime+0.2}});

// ---------------------------------------------------------------- template upload
$('#upgo').onclick=async()=>{const f=$('#upfile').files[0],name=$('#upname').value.trim();const m=$('#upmsg');if(!f||!name){m.textContent='Template name and file are required.';m.className='msg err';return}
 const fd=new FormData();fd.append('file',f);fd.append('preset',$('#uppreset').value);fd.append('layer',$('#uplayer').value.trim()||'frame');fd.append('x',$('#upx').value);fd.append('y',$('#upy').value);fd.append('z',$('#upz').value);fd.append('replace_all',$('#upreplace').checked);
 m.textContent='Uploading…';m.className='msg';try{const r=await fetch('/api/v1/composer/templates/'+encodeURIComponent(name)+'/layers',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.statusText);m.textContent='Saved layer into template “'+name+'”.';m.className='msg ok';SYSTEM=await api('/composer/system');TPL=name;renderTemplates();syncRenderButton()}catch(e){m.textContent=e.message;m.className='msg err'}};
init();
</script>
</body>
</html>
