<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Google+Sans+Code:wght@300..700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<link rel="stylesheet" href="/static/app.css">
<script>
  // If the Material Symbols font can't be fetched (offline server, blocked CDN) fall back to the inline SVG icons.
  (function () {
    var done = false, mark = function () { if (!done) { done = true; document.documentElement.classList.add('no-msym'); } };
    if (!document.fonts || !document.fonts.load) return;
    document.fonts.load('20px "Material Symbols Outlined"').then(function (f) { if (!f.length) mark(); }).catch(mark);
    setTimeout(function () { if (!document.fonts.check('20px "Material Symbols Outlined"')) mark(); }, 4000);
  })();
</script>
<link rel="icon" type="image/png" href="/static/assets/favicon.png">
</head>

    <div id="navitems"></div>

  </nav>
  <main>

      <span class="row gap4" id="pills"></span>
      <button class="btn icon" id="refresh" title="Refresh"><span class="icn"><span class="msym l">refresh</span><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></span></button>
    </header>

  </main>
</div>
